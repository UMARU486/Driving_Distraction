[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distraction-tool"
version = "0.1.0"
description = "Driver distraction risk MVP based on interpretable visual proxies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "opencv-python",
  "mediapipe",
  "numpy",
  "pandas",
  "matplotlib",
  "typer",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
